name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for gh pr comment
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Read/Grep/Glob are read-only and the repository is ALREADY checked
          # out in the step above, so this grants no access the job did not have
          # — it stops the reviewer being blindfolded in a directory it is
          # standing in. Without them it sees `gh pr diff` and nothing else: it
          # cannot check whether a changed function has other callers, cannot
          # read the test that covers it, cannot open the file the hunk sits in.
          #
          # On a large diff that is not just a worse review, it is a failed one.
          # PR #1179 spent 13 minutes and $8.85 accumulating 16 permission
          # denials across 6 turns and then errored with no comments at all.
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # THE REVIEW THAT REPORTS SUCCESS WITHOUT RUNNING.
      #
      # claude-code-action refuses to run when this file differs from the copy
      # on the DEFAULT branch — a real protection, since a pull request could
      # otherwise edit the workflow to read secrets. What it does next is the
      # problem: it logs "Exiting due to workflow validation skip" and exits
      # SUCCESS, so the PR shows a green check for a review that never happened.
      #
      # PR #1179 improved claude_args and merged to STAGING on 2026-08-26.
      # Staging's copy never reached main, so every PR into staging failed
      # validation from that day on. Seven merged unreviewed, all green. The
      # change that broke the reviewer was the change that fixed the reviewer.
      #
      # This turns that silence into a failure. It does NOT ask the action
      # whether it skipped — it checks the CAUSE directly, so it keeps working
      # if the action's internals change.
      #
      # A PR that CHANGES this file is exempt, and has to be: it necessarily
      # differs from main, and without the exemption the one-file PR that
      # restores the reviewer could never merge itself.
      - name: Fail if the reviewer was skipped instead of run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: .github/workflows/claude-code-review.yml
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # GitHub's contents API returns the git blob sha, which is exactly
          # what hash-object produces locally — directly comparable, and needs
          # no deeper fetch than the checkout above already did.
          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq .sha 2>/dev/null || echo "")
          LOCAL_SHA=$(git hash-object "$FILE")
          if [ "$MAIN_SHA" = "$LOCAL_SHA" ]; then
            echo "Review workflow matches main — the reviewer ran."
            exit 0
          fi
          if gh pr view "$PR" --json files --jq '.files[].path' | grep -qx "$FILE"; then
            echo "::warning::This PR changes the review workflow, so the reviewer skipped itself. Expected — it starts working once this lands on main."
            exit 0
          fi
          echo "::error::The Claude review did NOT run. ${FILE} differs from the copy on main, so the action skipped validation and exited success. Land the workflow file on main to re-enable reviews."
          exit 1
